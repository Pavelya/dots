name: poc release

# Builds the test APK and publishes it as a GitHub Release poc-v<version> with install notes for
# testers (docs/poc/install.md). Start it from the Actions tab ("Run workflow", enter a version
# such as 0.2), or by pushing a tag poc-v0.2.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test build version, for example 0.2"
        required: true
  push:
    tags:
      - "poc-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Version
        # Version 0.2 -> tag poc-v0.2, version name 0.2-poc; the code rises with every release run,
        # so each build installs over the one before.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then version="$INPUT_VERSION"; else version="${GITHUB_REF_NAME#poc-v}"; fi
          case "$version" in *[!0-9.]*|"") echo "Version must look like 0.2, got '$version'"; exit 1;; esac
          echo "RELEASE_TAG=poc-v$version" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version-poc" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Test and build
        run: ./gradlew --continue :engine:test :cli:test :app:verifyRoborazziDebug :app:lintDebug :app:assembleDebug
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="dots-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          # Creates the tag on this commit when it does not exist yet (a run from the Actions tab).
          gh release create "$RELEASE_TAG" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Dots test build ${VERSION_NAME}" \
            --notes-file docs/poc/install.md \
            --prerelease
