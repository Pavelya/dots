name: poc release

# Builds the test APK and publishes it as a GitHub Release poc-v<version> with install notes for
# testers (docs/poc/install.md). Start it from the Actions tab on main ("Run workflow", enter a
# version such as 0.2), or by pushing a tag poc-v0.2 on a commit of main. A run from any other
# branch, or on a tag outside main, fails: its build would get a higher version code than the
# real test builds and install over them.
#
# "Dry run" does everything except publish, from any branch: use it to check that the build signs
# with the POC test key.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Test build version, for example 0.2"
        required: true
      dry_run:
        description: "Dry run: build and sign, but publish nothing"
        type: boolean
        default: false
  push:
    tags:
      - "poc-v*"

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only from main or a poc-v* tag
        if: ${{ !inputs.dry_run }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/tags/poc-v*) ;;
            *) echo "::error::Test releases run only from main or a poc-v* tag, not $GITHUB_REF."; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: the version code counts commits
      - name: The commit is on main
        if: ${{ !inputs.dry_run }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not on main. Tag a commit of main."
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Version
        # Version 0.2 -> tag poc-v0.2, version name 0.2-poc. The version code is 100 + the number of
        # commits, the same rule as every CI build, so any newer build installs over an older one.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then version="$INPUT_VERSION"; else version="${GITHUB_REF_NAME#poc-v}"; fi
          case "$version" in *[!0-9.]*|"") echo "Version must look like 0.2, got '$version'"; exit 1;; esac
          echo "RELEASE_TAG=poc-v$version" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version-poc" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((100 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"
      - name: Test signing key
        # From the Actions secrets POC_KEYSTORE_BASE64 and POC_KEYSTORE_PASSWORD. A test release is
        # never signed with anything else.
        env:
          POC_KEYSTORE_BASE64: ${{ secrets.POC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$POC_KEYSTORE_BASE64" ]; then
            echo "::error::The Actions secret POC_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          echo "$POC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/poc-test.keystore"
          echo "POC_KEYSTORE_FILE=$RUNNER_TEMP/poc-test.keystore" >> "$GITHUB_ENV"
      - name: Test and build
        env:
          POC_KEYSTORE_PASSWORD: ${{ secrets.POC_KEYSTORE_PASSWORD }}
        run: ./gradlew --continue :engine:test :cli:test :app:verifyRoborazziDebug :app:lintDebug :app:assembleDebug
      - name: Signing certificate
        # Fails on the standard debug key and on the old test key, which was public in this
        # repository's history and must never sign a build again.
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key."; exit 1
          fi
          if echo "$certs" | grep -q "12c78c2de6daa31c1b4d95242609f229066f6278741638edb946438eb1ee0e97"; then
            echo "::error::The APK is signed with the old, public test key."; exit 1
          fi
      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="pinfold-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          # Creates the tag on this commit when it does not exist yet (a run from the Actions tab).
          gh release create "$RELEASE_TAG" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Pinfold test build ${VERSION_NAME}" \
            --notes-file docs/poc/install.md \
            --prerelease
